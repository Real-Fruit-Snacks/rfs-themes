    <g font-family="ui-monospace,Consolas,monospace" font-size="10.2">
      <text x="212" y="88" fill="#8C96A6">// Cyclorama Dawn v2.1.0 — Steel &amp; Beacon Orange</text>
      <text x="212" y="109"><tspan fill="#74B8E8" font-weight="700">pub struct </tspan><tspan fill="#56D4E0" font-weight="700">StageCue </tspan><tspan fill="#B3B5C0">&#123; </tspan><tspan fill="#99CDF2">lx</tspan><tspan fill="#B3B5C0">: </tspan><tspan fill="#56D4E0">u16</tspan><tspan fill="#B3B5C0">, </tspan><tspan fill="#99CDF2">name</tspan><tspan fill="#B3B5C0">: &amp;'static </tspan><tspan fill="#56D4E0">str </tspan><tspan fill="#B3B5C0">&#125;</tspan></text>
      <text x="212" y="130"><tspan fill="#74B8E8" font-weight="700">pub const </tspan><tspan fill="#C996F5" font-weight="700">DEFAULT_CUE</tspan><tspan fill="#B3B5C0">: </tspan><tspan fill="#56D4E0">StageCue </tspan><tspan fill="#D6D8E0">= </tspan><tspan fill="#56D4E0">StageCue </tspan><tspan fill="#B3B5C0">&#123;</tspan></text>
      <text x="212" y="151"><tspan fill="#99CDF2">    lx</tspan><tspan fill="#B3B5C0">: </tspan><tspan fill="#3DDC97" font-weight="700">263</tspan><tspan fill="#B3B5C0">, </tspan><tspan fill="#99CDF2">name</tspan><tspan fill="#B3B5C0">: </tspan><tspan fill="#FFC247">"Beacon Horizon"</tspan><tspan fill="#B3B5C0">,</tspan></text>
      <text x="212" y="172"><tspan fill="#B3B5C0">&#125;; </tspan><tspan fill="#74B8E8" font-weight="700">pub fn </tspan><tspan fill="#FF9254" font-weight="700">verify_wcag</tspan><tspan fill="#B3B5C0">(</tspan><tspan fill="#FFB07A">fg</tspan><tspan fill="#B3B5C0">: &amp;</tspan><tspan fill="#56D4E0">str</tspan><tspan fill="#B3B5C0">, </tspan><tspan fill="#FFB07A">bg</tspan><tspan fill="#B3B5C0">: &amp;</tspan><tspan fill="#56D4E0">str</tspan><tspan fill="#B3B5C0">) -&gt; </tspan><tspan fill="#56D4E0">f64 </tspan><tspan fill="#B3B5C0">&#123;</tspan></text>
      <text x="212" y="193"><tspan fill="#74B8E8" font-weight="700">    let </tspan><tspan fill="#F4F5F8">ratio </tspan><tspan fill="#D6D8E0">= </tspan><tspan fill="#FF9254">contrast_ratio</tspan><tspan fill="#B3B5C0">(</tspan><tspan fill="#FFB07A">fg</tspan><tspan fill="#B3B5C0">, </tspan><tspan fill="#FFB07A">bg</tspan><tspan fill="#B3B5C0">);</tspan></text>
      <text x="212" y="214"><tspan fill="#74B8E8" font-weight="700">    assert!</tspan><tspan fill="#B3B5C0">(</tspan><tspan fill="#F4F5F8">ratio </tspan><tspan fill="#D6D8E0">&gt;= </tspan><tspan fill="#3DDC97" font-weight="700">4.5</tspan><tspan fill="#B3B5C0">, </tspan><tspan fill="#FFC247">"[x] AA contrast failed"</tspan><tspan fill="#B3B5C0">);</tspan></text>
      <text x="212" y="235"><tspan fill="#74B8E8" font-weight="700">    println!</tspan><tspan fill="#B3B5C0">(</tspan><tspan fill="#FFC247">"[ok] &#123;ratio:.2&#125;:1 calibrated"</tspan><tspan fill="#B3B5C0">);</tspan></text>
      <text x="212" y="256"><tspan fill="#F4F5F8">    ratio</tspan></text>
      <text x="212" y="277"><tspan fill="#B3B5C0">&#125;</tspan></text>
      <text x="212" y="298" fill="#8C96A6">// Built local-first · Real-Fruit-Snacks</text>
    </g>

