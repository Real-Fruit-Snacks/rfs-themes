# Cyclorama Dawn v2.3.2 — Starship Prompt Configuration
# Variant: Cyclorama Day (LX 512 · Light · Alabaster Day)
# Author:  Real-Fruit-Snacks
# Source:  https://github.com/Real-Fruit-Snacks/rfs-themes

"$schema" = "https://starship.rs/config-schema.json"

palette = "cyclorama_day"
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$rust\
$python\
$nodejs\
$cmd_duration\
$line_break\
$character"""

[directory]
style = "bold fg:on_accent bg:secondary_fill"
read_only = " [ro]"
read_only_style = "bold fault"
format = "[ $path ]($style)[$read_only]($read_only_style) "
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = "git:"
style = "bold fg:on_accent bg:accent_fill"
format = "[ $symbol$branch ]($style) "

[git_status]
style = "bold warning"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "!"
ahead = "^${count}"
behind = "v${count}"
diverged = "^${ahead_count}v${behind_count}"
untracked = "?${count}"
stashed = "*${count}"
modified = "~${count}"
staged = "+${count}"
deleted = "-${count}"

[rust]
symbol = "rs "
style = "bold warning"
format = "[$symbol($version)]($style) "

[python]
symbol = "py "
style = "bold signal"
format = "[$symbol$pyenv_prefix($version )(\\($virtualenv\\) )]($style)"

[nodejs]
symbol = "node "
style = "bold cyan"
format = "[$symbol($version)]($style) "

[cmd_duration]
min_time = 2000
style = "mute"
format = "[$duration]($style) "

[character]
success_symbol = "[>](bold accent)"
error_symbol = "[x](bold fault)"
vimcmd_symbol = "[<](bold secondary)"

