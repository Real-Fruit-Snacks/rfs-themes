name: check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Rebuild generated theme outputs and verify contrast & schema
        run: |
          python tools/build-privacynotes.py
          python tools/verify-themes.py
          git diff --exit-code -- apps/privacynotes/codes.txt apps/privacynotes/previews/
