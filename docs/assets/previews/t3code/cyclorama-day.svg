s,monospace" font-size="8" font-weight="600">STR</text><rect x="517.2" y="357" width="56" height="10" rx="2.5" fill="#127247" stroke="#C8D0DA" stroke-width="0.8"/><text x="545.2" y="378" text-anchor="middle" fill="#474D59" font-family="ui-monospace,Consolas,monospace" font-size="8" font-weight="600">OK</text><rect x="579.6" y="357" width="56" height="10" rx="2.5" fill="#B91C2E" stroke="#C8D0DA" stroke-width="0.8"/><text x="607.6" y="378" text-anchor="middle" fill="#474D59" font-family="ui-monospace,Consolas,monospace" font-size="8" font-weight="600">ERR</text>
