      <text x="204" y="221"><tspan fill="#1F547A">  "colors"</tspan><tspan fill="#474D59">: &#123; </tspan><tspan fill="#164669">/* 61 T3 Code v1 roles calibrated */</tspan><tspan fill="#474D59"> &#125; &#125;</tspan></text>
      <text x="204" y="239" fill="#58606E">// [ok] 53/53 WCAG AA pairs &gt;= 4.5:1 · CSS hooks verified</text>
