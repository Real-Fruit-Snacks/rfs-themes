    <g font-family="ui-monospace,Consolas,monospace" font-size="10.2">
      <text x="212" y="88" fill="#58606E">// Cyclorama Dawn v2.1.0 — Steel &amp; Beacon Orange</text>
      <text x="212" y="109"><tspan fill="#164669" font-weight="700">pub struct </tspan><tspan fill="#0E6674" font-weight="700">StageCue </tspan><tspan fill="#474D59">&#123; </tspan><tspan fill="#1F547A">lx</tspan><tspan fill="#474D59">: </tspan><tspan fill="#0E6674">u16</tspan><tspan fill="#474D59">, </tspan><tspan fill="#1F547A">name</tspan><tspan fill="#474D59">: &amp;'static </tspan><tspan fill="#0E6674">str </tspan><tspan fill="#474D59">&#125;</tspan></text>
      <text x="212" y="130"><tspan fill="#164669" font-weight="700">pub const </tspan><tspan fill="#6B38B8" font-weight="700">DEFAULT_CUE</tspan><tspan fill="#474D59">: </tspan><tspan fill="#0E6674">StageCue </tspan><tspan fill="#252A34">= </tspan><tspan fill="#0E6674">StageCue </tspan><tspan fill="#474D59">&#123;</tspan></text>
      <text x="212" y="151"><tspan fill="#1F547A">    lx</tspan><tspan fill="#474D59">: </tspan><tspan fill="#127247" font-weight="700">263</tspan><tspan fill="#474D59">, </tspan><tspan fill="#1F547A">name</tspan><tspan fill="#474D59">: </tspan><tspan fill="#885800">"Beacon Horizon"</tspan><tspan fill="#474D59">,</tspan></text>
      <text x="212" y="172"><tspan fill="#474D59">&#125;; </tspan><tspan fill="#164669" font-weight="700">pub fn </tspan><tspan fill="#AD3D0A" font-weight="700">verify_wcag</tspan><tspan fill="#474D59">(</tspan><tspan fill="#943207">fg</tspan><tspan fill="#474D59">: &amp;</tspan><tspan fill="#0E6674">str</tspan><tspan fill="#474D59">, </tspan><tspan fill="#943207">bg</tspan><tspan fill="#474D59">: &amp;</tspan><tspan fill="#0E6674">str</tspan><tspan fill="#474D59">) -&gt; </tspan><tspan fill="#0E6674">f64 </tspan><tspan fill="#474D59">&#123;</tspan></text>
      <text x="212" y="193"><tspan fill="#164669" font-weight="700">    let </tspan><tspan fill="#0D1016">ratio </tspan><tspan fill="#252A34">= </tspan><tspan fill="#AD3D0A">contrast_ratio</tspan><tspan fill="#474D59">(</tspan><tspan fill="#943207">fg</tspan><tspan fill="#474D59">, </tspan><tspan fill="#943207">bg</tspan><tspan fill="#474D59">);</tspan></text>
      <text x="212" y="214"><tspan fill="#164669" font-weight="700">    assert!</tspan><tspan fill="#474D59">(</tspan><tspan fill="#0D1016">ratio </tspan><tspan fill="#252A34">&gt;= </tspan><tspan fill="#127247" font-weight="700">4.5</tspan><tspan fill="#474D59">, </tspan><tspan fill="#885800">"[x] AA contrast failed"</tspan><tspan fill="#474D59">);</tspan></text>
      <text x="212" y="235"><tspan fill="#164669" font-weight="700">    println!</tspan><tspan fill="#474D59">(</tspan><tspan fill="#885800">"[ok] &#123;ratio:.2&#125;:1 calibrated"</tspan><tspan fill="#474D59">);</tspan></text>
      <text x="212" y="256"><tspan fill="#0D1016">    ratio</tspan></text>
      <text x="212" y="277"><tspan fill="#474D59">&#125;</tspan></text>
      <text x="212" y="298" fill="#58606E">// Built local-first · Real-Fruit-Snacks</text>
    </g>

